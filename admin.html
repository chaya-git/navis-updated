<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navis – Admin Settings</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="connection.css">
    <link rel="icon" href="images/robomanthan_logo.png" type="image/png">
    <style>
        html, body { overflow-y: auto; }
        .admin-wrap {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .admin-card { max-width: 460px; }
        .admin-card h2 { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .admin-hint { font-size: 0.8rem; color: var(--text-3); margin-top: -14px; margin-bottom: 20px; }
        .current-key-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            font-family: monospace;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: left;
            color: var(--text-2);
        }
        .current-key-box .label {
            display: block;
            font-family: var(--font);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.7rem;
            color: var(--text-3);
            margin-bottom: 6px;
        }
        .admin-logout {
            background: transparent;
            border: none;
            color: var(--text-3);
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 16px;
            text-decoration: underline;
        }
        #adminApp { display: none; }
    </style>
</head>

<body>
    <div class="admin-wrap">

        <!-- ── Login form ─────────────────────────────────────── -->
        <div class="connection-card admin-card" id="loginCard">
            <h2>🔐 Admin Login</h2>
            <p>Sign in to manage the Navis AI configuration.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
            </form>
            <div class="status-text" id="loginStatus"></div>
        </div>

        <!-- ── Admin settings (shown after login) ─────────────── -->
        <div class="connection-card admin-card" id="adminApp">
            <h2>⚙️ AI Configuration</h2>
            <p>Update the API key Navis uses for chatbot responses.</p>

            <div class="current-key-box">
                <span class="label">Currently active key</span>
                <span id="currentKeyDisplay">Loading…</span>
            </div>

            <form id="configForm">
                <div class="form-group">
                    <label for="providerInput">AI Provider</label>
                    <input type="text" id="providerInput" value="groq">
                </div>
                <div class="form-group">
                    <label for="apiKeyInput">API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="gsk_..." autocomplete="off"
                        style="font-family:monospace;">
                </div>
                <button type="submit" class="btn-primary" id="saveKeyBtn">Save / Update API Key</button>
            </form>
            <div class="status-text" id="configStatus"></div>

            <button class="admin-logout" id="logoutBtn">Log out</button>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>

</html>
